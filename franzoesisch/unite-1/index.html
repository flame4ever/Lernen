<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mots de la ville</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout: one narrow column on French Seyès notebook paper; every word appears on a Paris street-sign plaque. */
:root {
  --paper: #F8FAFF;
  --line: #D5E0F5;
  --line-soft: #EBF0FA;
  --margin: #EBA9C0;
  --ink: #18213D;
  --muted: #59628A;
  --card: #FFFFFF;
  --edge: #CBD5EC;
  --plaque: #1D3C78;
  --plaque-frame: #2C7A58;
  --plaque-ink: #FFFFFF;
  --accent: #E46F22;
  --accent-ink: #FFFFFF;
  --accent-soft: #FDEBDD;
  --ok: #1F8A50;
  --ok-soft: #DDF3E6;
  --bad: #C93A3A;
  --bad-soft: #FBE3E3;
  --warn: #A86A00;
  --warn-soft: #FFF1D2;
  --shadow: rgba(24, 40, 90, .18);
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --ipa: "Noto Sans", "DejaVu Sans", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10152A; --line: #1F2843; --line-soft: #161D35; --margin: #4D2639;
    --ink: #E6EAF7; --muted: #9AA3C5; --card: #18203B; --edge: #2E3A60;
    --plaque: #24478A; --plaque-frame: #2F8A62; --plaque-ink: #FFFFFF;
    --accent: #F2843A; --accent-ink: #1A1206; --accent-soft: #3A2616;
    --ok: #47C482; --ok-soft: #173826; --bad: #F07272; --bad-soft: #3D1C22;
    --warn: #F2B544; --warn-soft: #3A2E12; --shadow: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10152A; --line: #1F2843; --line-soft: #161D35; --margin: #4D2639;
  --ink: #E6EAF7; --muted: #9AA3C5; --card: #18203B; --edge: #2E3A60;
  --plaque: #24478A; --plaque-frame: #2F8A62; --plaque-ink: #FFFFFF;
  --accent: #F2843A; --accent-ink: #1A1206; --accent-soft: #3A2616;
  --ok: #47C482; --ok-soft: #173826; --bad: #F07272; --bad-soft: #3D1C22;
  --warn: #F2B544; --warn-soft: #3A2E12; --shadow: rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--paper);
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px),
    repeating-linear-gradient(to bottom, transparent 0 7px, var(--line-soft) 7px 8px);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
@media (min-width: 760px) {
  body::after {
    content: ""; position: fixed; top: 0; bottom: 0; left: 72px; width: 2px;
    background: var(--margin); pointer-events: none;
  }
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* ---------- Street-sign plaque ---------- */
.plaque {
  background: var(--plaque);
  color: var(--plaque-ink);
  border: 5px solid var(--plaque-frame);
  border-radius: 16px;
  padding: 5px;
  box-shadow: 0 3px 0 var(--shadow), 0 14px 30px -16px var(--shadow);
}
.plaque-inner {
  border: 2px solid rgba(255, 255, 255, .9);
  border-radius: 10px;
  padding: 12px 18px 16px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  position: relative;
}
.plaque .arr {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; font-weight: 700;
}
.plaque .word {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(30px, 8.5vw, 46px); line-height: 1.12;
  text-wrap: balance; overflow-wrap: anywhere;
}
.plaque .word .gap { display: inline-block; min-width: 2.2ch; border-bottom: 3px solid currentColor; margin-right: .25em; opacity: .9; }
.plaque.hero .word { font-size: clamp(34px, 10vw, 52px); }
.speak {
  position: absolute; right: 8px; top: 8px;
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.7); background: transparent; color: var(--plaque-ink);
  display: grid; place-items: center;
}
.speak:hover { background: rgba(255,255,255,.14); }
.speak svg { width: 20px; height: 20px; }

/* ---------- Home ---------- */
.lede { margin: 0; color: var(--muted); text-align: center; }
.label {
  font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 8px;
}
.panel {
  background: var(--card); border: 2px solid var(--edge); border-radius: 14px; padding: 14px 16px;
}
.meter-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.meter-row strong { font-family: var(--display); font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.meter { height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 10px; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.small { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  flex: 1 1 auto; padding: 9px 12px; border-radius: 99px; border: 2px solid var(--edge);
  background: var(--card); font-weight: 700; font-size: 15px;
}
.seg button[aria-pressed="true"] { background: var(--plaque); border-color: var(--plaque); color: var(--plaque-ink); }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 440px) { .modes { grid-template-columns: 1fr; } }
.mode {
  text-align: left; background: var(--card); border: 2px solid var(--edge); border-radius: 14px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
  box-shadow: 0 3px 0 var(--edge);
  transition: transform .12s ease, box-shadow .12s ease, border-color .12s;
}
.mode:hover { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent); }
.mode:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent); }
.mode b { font-family: var(--display); font-size: 21px; line-height: 1.15; font-weight: 800; }
.mode span { font-size: 15px; color: var(--muted); }
.mode em { font-style: normal; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

.tip {
  background: var(--accent-soft); border-radius: 14px; padding: 14px 16px;
  display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
}
.tip .flea { width: 52px; height: 52px; }
.tip p { margin: 0; }
.tip .pair { font-family: var(--display); font-size: 20px; font-weight: 800; line-height: 1.25; }
.tip .pair i { font-style: normal; color: var(--muted); font-family: var(--body); font-weight: 400; font-size: 16px; }

details.words { background: var(--card); border: 2px solid var(--edge); border-radius: 14px; }
details.words summary { padding: 14px 16px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
details.words summary::-webkit-details-marker { display: none; }
details.words summary::after { content: "+"; font-family: var(--display); font-size: 24px; line-height: 1; color: var(--accent); }
details.words[open] summary::after { content: "–"; }
.wl { list-style: none; margin: 0; padding: 0 16px 8px; }
.wl li {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0;
  border-top: 1px solid var(--edge);
}
.wl .fr { font-weight: 700; }
.wl .de { color: var(--muted); grid-column: 1; }
.wl .tools { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 10px; }
.ipa { font-family: var(--ipa); font-weight: 400; color: var(--muted); font-size: .9em; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ok); }
.dots i.on { background: var(--ok); }
.mini-speak {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--edge); background: transparent;
  display: grid; place-items: center; color: var(--plaque);
}
:root[data-theme="dark"] .mini-speak { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mini-speak { color: var(--ink); } }
.mini-speak svg { width: 18px; height: 18px; }

.reset { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 14px; padding: 4px; }

/* ---------- Quiz ---------- */
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ghost { background: var(--card); border: 2px solid var(--edge); border-radius: 99px; padding: 6px 14px; font-weight: 700; font-size: 15px; }
.count { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); }
.score { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ok); }
.meter.thin { height: 8px; margin-top: -10px; }
.ask { margin: 0 0 -10px; text-align: center; font-weight: 700; color: var(--muted); }

.opts { display: grid; gap: 10px; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--card); border: 2px solid var(--edge); border-radius: 14px;
  padding: 12px 14px; font-size: 19px; font-weight: 700; min-height: 58px;
  box-shadow: 0 3px 0 var(--edge);
  transition: transform .1s, box-shadow .1s, background .15s, border-color .15s;
}
.opts.three .opt { justify-content: center; font-family: var(--display); font-size: 28px; font-weight: 800; }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.opt .k {
  flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--line-soft); color: var(--muted);
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
}
.opt:disabled { cursor: default; }
.opt.is-right { background: var(--ok-soft); border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); }
.opt.is-wrong { background: var(--bad-soft); border-color: var(--bad); box-shadow: 0 3px 0 var(--bad); }
.opt.is-dim { opacity: .5; }

.write { display: flex; flex-direction: column; gap: 10px; }
.write-row { display: flex; gap: 8px; }
.write input {
  flex: 1; min-width: 0; padding: 12px 14px; font-size: 22px; font-weight: 700;
  border-radius: 14px; border: 2px solid var(--edge); background: var(--card);
}
.write input:focus { outline: none; border-color: var(--accent); }
.write input:disabled { opacity: .85; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.keys button {
  min-width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--edge); background: var(--card);
  font-size: 20px; font-weight: 700;
}
.btn {
  border: 0; border-radius: 14px; padding: 12px 20px; font-weight: 700; font-size: 18px;
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000);
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn.secondary { background: var(--card); color: var(--ink); border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
.btn.good { background: var(--ok); color: var(--card); box-shadow: 0 3px 0 color-mix(in srgb, var(--ok) 60%, #000); }
.btn.bad { background: var(--bad); color: var(--card); box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 60%, #000); }
.btn.wide { width: 100%; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.fb {
  border-radius: 14px; padding: 14px 16px; border: 2px solid; display: flex; flex-direction: column; gap: 6px;
  animation: pop .22s ease-out;
}
.fb h3 { margin: 0; font-family: var(--display); font-size: 24px; line-height: 1.1; }
.fb p { margin: 0; }
.fb .sol { font-size: 18px; }
.fb .sol b { font-size: 20px; }
.fb .note { font-size: 15px; padding-top: 6px; border-top: 1px dashed currentColor; }
.fb.right { background: var(--ok-soft); border-color: var(--ok); }
.fb.right h3 { color: var(--ok); }
.fb.wrong { background: var(--bad-soft); border-color: var(--bad); }
.fb.wrong h3 { color: var(--bad); }
.fb.almost { background: var(--warn-soft); border-color: var(--warn); }
.fb.almost h3 { color: var(--warn); }
.fb .sol-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fb .note { border-top-color: var(--edge); }
@keyframes pop { from { transform: scale(.97); opacity: .4; } to { transform: none; opacity: 1; } }

.card-back { text-align: center; padding: 18px 16px; }
.card-back .de { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.15; }
.card-back .fr { font-size: 20px; font-weight: 700; }

/* ---------- Result ---------- */
.stars { display: flex; justify-content: center; gap: 8px; }
.stars svg { width: 48px; height: 48px; }
.stars .on { fill: var(--accent); }
.stars .off { fill: var(--line); }
.result-msg { text-align: center; margin: 0; font-size: 19px; }
.miss { list-style: none; margin: 0; padding: 0; }
.miss li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--edge); flex-wrap: wrap; }
.miss li:first-child { border-top: 0; }
.miss .de { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 10px; }

canvas.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<main class="app" id="app"></main>

<script>
(() => {
  // ---------- Vokabeln: Unité 1, Vocabulaire thématique ----------
  const NOTE_GENDER = "Achtung: Im Deutschen hat das Wort ein anderes Geschlecht als im Französischen.";
  const WORDS = [
    { id: "ville",       fr: "la ville",       art: "la",  noun: "ville",       ipa: "[lavil]",        de: "die Stadt" },
    { id: "cinema",      fr: "le cinéma",      art: "le",  noun: "cinéma",      ipa: "[ləsinema]",     de: "das Kino" },
    { id: "parc",        fr: "le parc",        art: "le",  noun: "parc",        ipa: "[ləpaʀk]",       de: "der Park" },
    { id: "theatre",     fr: "le théâtre",     art: "le",  noun: "théâtre",     ipa: "[ləteɑtʀ]",      de: "das Theater" },
    { id: "cafe",        fr: "le café",        art: "le",  noun: "café",        ipa: "[ləkafe]",       de: "das Café", note: "Le café heißt auch: der Kaffee." },
    { id: "restaurant",  fr: "le restaurant",  art: "le",  noun: "restaurant",  ipa: "[ləʀɛstɔʀɑ̃]",   de: "das Restaurant" },
    { id: "hotel",       fr: "l'hôtel",        art: "l'",  noun: "hôtel",       ipa: "[lotɛl] m.",     de: "das Hotel", note: "Hôtel ist männlich (m.). Vor einem Vokal oder stummen h wird aus le oder la ein l'." },
    { id: "musee",       fr: "le musée",       art: "le",  noun: "musée",       ipa: "[ləmyze]",       de: "das Museum", note: "Le musée ist männlich, obwohl es auf -ée endet." },
    { id: "metro",       fr: "le métro",       art: "le",  noun: "métro",       ipa: "[ləmetʀo]",      de: "die U-Bahn, die Metro", note: NOTE_GENDER + " Die U-Bahn, aber le métro." },
    { id: "tour",        fr: "la tour",        art: "la",  noun: "tour",        ipa: "[latuʀ]",        de: "der Turm", note: NOTE_GENDER + " Der Turm, aber la tour." },
    { id: "supermarche", fr: "le supermarché", art: "le",  noun: "supermarché", ipa: "[ləsypɛʀmaʀʃe]", de: "der Supermarkt" },
    { id: "college",     fr: "le collège",     art: "le",  noun: "collège",     ipa: "[ləkɔlɛʒ]",      de: "die Schule", note: NOTE_GENDER + " Die Schule, aber le collège." },
    { id: "stade",       fr: "le stade",       art: "le",  noun: "stade",       ipa: "[ləstad]",       de: "das Stadion" },
    { id: "pardon",      fr: "pardon",                                         ipa: "[paʀdɔ̃]",        de: "Verzeihung, Entschuldigung" },
    { id: "ouest",       fr: "Où est …?",      flea: true,                     ipa: "[uɛ]",           de: "Wo ist …?" },
    { id: "ou",          fr: "Où …?",          flea: true,                     ipa: "[u]",            de: "Wo …?, Wohin …?", note: "Fragewort. Auf dem „wo“ sitzt ein „Floh“: où = wo, ou = oder." },
  ];
  const NOUNS = WORDS.filter(w => w.art);
  const byId = Object.fromEntries(WORDS.map(w => [w.id, w]));

  const MODES = {
    cards:   { name: "Karteikarten", desc: "Wort ansehen, umdrehen, selbst prüfen.", tag: "Zum Einprägen", useDir: true },
    choice:  { name: "Wort-Quiz", desc: "Die richtige Übersetzung antippen.", tag: "4 Antworten", useDir: true },
    write:   { name: "Schreiben", desc: "Deutsch sehen, Französisch tippen.", tag: "Für Profis", useDir: false },
    article: { name: "le, la oder l'?", desc: "Den richtigen Artikel finden.", tag: "Artikel", useDir: false },
  };
  const DIRS = { "fr-de": "Französisch → Deutsch", "de-fr": "Deutsch → Französisch", "mix": "Gemischt" };

  // ---------- Speicher (nur in diesem Browser) ----------
  const KEY = "mots-de-la-ville.v1";
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let progress = load(KEY, {});
  let dir = load(KEY + ".dir", "fr-de");
  if (!DIRS[dir]) dir = "fr-de";

  const streak = id => Math.min(3, (progress[id] && progress[id].s) || 0);
  const masteredCount = () => WORDS.filter(w => streak(w.id) >= 3).length;
  function record(w, ok) {
    const p = progress[w.id] || { s: 0, r: 0, n: 0 };
    p.n++; if (ok) { p.r++; p.s++; } else { p.s = 0; }
    progress[w.id] = p; save(KEY, progress);
  }

  // ---------- Helfer ----------
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = s => s.toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/…|\.\.\./g, " ")
    .replace(/[?!.,;:¿¡"]/g, " ")
    .replace(/'/g, " ")
    .replace(/\s+/g, " ").trim();
  const plain = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");

  const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const canSpeak = (() => { try { return "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function"; } catch (e) { return false; } })();
  let frVoice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      frVoice = vs.find(v => /^fr(-|_)FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null;
    } catch (e) {}
  }
  if (canSpeak) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
  function speak(text) {
    if (!canSpeak) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/…|\.\.\.|\?/g, " ").trim());
      u.lang = "fr-FR"; u.rate = 0.85;
      if (frVoice) u.voice = frVoice;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  const speakBtn = (text, cls = "speak") => canSpeak
    ? `<button class="${cls}" data-act="speak" data-text="${esc(text)}" aria-label="Aussprache anhören: ${esc(text)}" title="Anhören">${SPEAKER}</button>` : "";

  // ---------- Zustand ----------
  const app = document.getElementById("app");
  let S = { screen: "home", confirmReset: false };

  function startRound(mode, words) {
    const pool = words || (mode === "article" ? NOUNS : WORDS);
    S = {
      screen: "quiz", mode, queue: shuffle(pool), i: 0, right: 0, wrong: [],
      q: null, answered: false, res: null, typed: "", flipped: false,
    };
    S.q = makeQuestion(S.queue[0]);
    render();
  }

  function makeQuestion(w) {
    const mode = S.mode;
    const d = dir === "mix" ? (Math.random() < .5 ? "fr-de" : "de-fr") : dir;
    if (mode === "choice") {
      const toDe = d === "fr-de";
      const field = toDe ? "de" : "fr";
      const others = shuffle(WORDS.filter(x => x.id !== w.id)).slice(0, 3).map(x => x[field]);
      return {
        w, toDe, prompt: toDe ? w.fr : w.de, promptFr: toDe,
        ask: toDe ? "Was heißt das auf Deutsch?" : "Was heißt das auf Französisch?",
        correct: w[field], options: shuffle([w[field], ...others]),
      };
    }
    if (mode === "article") {
      return { w, prompt: w.noun, promptFr: true, ask: "Welcher Artikel passt?", correct: w.art, options: ["le", "la", "l'"] };
    }
    if (mode === "write") {
      return { w, prompt: w.de, promptFr: false, ask: w.art ? "Schreib das französische Wort mit Artikel." : "Schreib es auf Französisch." };
    }
    // cards
    const toDe = d === "fr-de";
    return { w, toDe, prompt: toDe ? w.fr : w.de, promptFr: toDe, ask: toDe ? "Weißt du, was das heißt?" : "Wie heißt das auf Französisch?" };
  }

  // ---------- Antworten prüfen ----------
  function answerChoice(idx) {
    if (S.answered) return;
    const pick = S.q.options[idx];
    const ok = pick === S.q.correct;
    S.picked = pick;
    finish(ok, ok ? rightRes() : wrongRes());
  }

  function answerWrite(value) {
    if (S.answered) return;
    const w = S.q.w;
    const a = norm(value);
    if (!a) return;
    S.typed = value;
    const target = norm(w.fr);
    if (a === target) return finish(true, rightRes());
    if (plain(a) === plain(target)) {
      if (w.flea) {
        return finish(false, { kind: "wrong", title: "Der Floh fehlt!", lead: "Ohne Akzent heißt ou „oder“. Für „wo“ brauchst du où mit Akzent." });
      }
      return finish(true, { kind: "almost", title: "Fast perfekt!", lead: "Richtig, aber achte auf die Akzente." });
    }
    if (w.art) {
      const bare = plain(norm(w.noun));
      if (plain(a) === bare) {
        return finish(false, { kind: "almost", title: "Der Artikel fehlt!", lead: "Lerne jedes Nomen immer mit seinem Artikel." });
      }
      const m = plain(a).match(/^(le|la|l|les|un|une)\s?(.+)$/);
      if (m && m[2] === bare) {
        return finish(false, { kind: "almost", title: "Falscher Artikel!", lead: "Das Wort stimmt, nur der Artikel nicht." });
      }
    }
    finish(false, wrongRes());
  }

  function answerCard(ok) {
    if (S.answered) return;
    finish(ok, null, true);
    next();
  }

  const PRAISE = ["Richtig!", "Super!", "Très bien !", "Genau!", "Bravo !", "Klasse!"];
  const rightRes = () => ({ kind: "right", title: PRAISE[Math.floor(Math.random() * PRAISE.length)] });
  const wrongRes = () => ({ kind: "wrong", title: "Leider falsch." });

  function finish(ok, res, silent) {
    S.answered = true; S.res = res;
    record(S.q.w, ok);
    if (ok) S.right++; else if (!S.wrong.includes(S.q.w.id)) S.wrong.push(S.q.w.id);
    if (!silent) render();
  }

  function next() {
    S.i++;
    if (S.i >= S.queue.length) { S.screen = "result"; render(); return; }
    S.q = makeQuestion(S.queue[S.i]);
    S.answered = false; S.res = null; S.typed = ""; S.flipped = false; S.picked = null;
    render();
  }

  // ---------- Darstellung ----------
  function render() {
    if (S.screen === "home") app.innerHTML = homeView();
    else if (S.screen === "quiz") app.innerHTML = quizView();
    else app.innerHTML = resultView();
    afterRender();
  }

  function homeView() {
    const m = masteredCount();
    return `
      <header class="plaque hero">
        <div class="plaque-inner">
          <div class="arr">Unité 1 · Vocabulaire</div>
          <h1 class="word" style="margin:0">Mots de la ville</h1>
        </div>
      </header>
      <p class="lede">16 französische Wörter rund um die Stadt. Such dir eine Übung aus.</p>

      <section class="panel" aria-label="Lernstand">
        <div class="meter-row"><span><strong>${m} von ${WORDS.length}</strong> Wörtern sitzen</span>
          <span class="small" style="margin:0">${m === WORDS.length ? "Alles gelernt!" : "Weiter so!"}</span></div>
        <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${WORDS.length}" aria-valuenow="${m}"><span style="width:${(m / WORDS.length) * 100}%"></span></div>
        <p class="small">Ein Wort sitzt, wenn du es dreimal hintereinander richtig hast.</p>
      </section>

      <section>
        <h2 class="label">Richtung für Karteikarten und Wort-Quiz</h2>
        <div class="seg" role="group" aria-label="Richtung">
          ${Object.entries(DIRS).map(([k, v]) => `<button data-act="dir" data-v="${k}" aria-pressed="${dir === k}">${v}</button>`).join("")}
        </div>
      </section>

      <section>
        <h2 class="label">Übungen</h2>
        <div class="modes">
          ${Object.entries(MODES).map(([k, v]) => `
            <button class="mode" data-act="start" data-mode="${k}">
              <em>${v.tag}</em><b>${v.name}</b><span>${v.desc}</span>
            </button>`).join("")}
        </div>
      </section>

      <aside class="tip">
        ${FLEA}
        <div>
          <p class="small" style="margin:0 0 2px">Eselsbrücke</p>
          <p><b>Auf dem „wo“ sitzt ein „Floh“.</b></p>
          <p class="pair">où <i>= wo</i> &nbsp;·&nbsp; ou <i>= oder</i></p>
        </div>
      </aside>

      <details class="words">
        <summary>Alle Wörter ansehen</summary>
        <ul class="wl">
          ${WORDS.map(w => `
            <li>
              <span><span class="fr">${esc(w.fr)}</span> <span class="ipa">${esc(w.ipa)}</span></span>
              <span class="de">${esc(w.de)}</span>
              <span class="tools">
                <span class="dots" title="${streak(w.id)} von 3 richtig in Folge" aria-label="${streak(w.id)} von 3">${[0, 1, 2].map(i => `<i class="${i < streak(w.id) ? "on" : ""}"></i>`).join("")}</span>
                ${speakBtn(w.fr, "mini-speak")}
              </span>
            </li>`).join("")}
        </ul>
      </details>

      <div class="reset">
        ${S.confirmReset
          ? `<p class="small" style="margin:0">Lernstand wirklich löschen?</p>
             <div class="btn-row" style="width:100%;max-width:360px">
               <button class="btn bad" data-act="reset-yes">Ja, löschen</button>
               <button class="btn secondary" data-act="reset-no">Abbrechen</button>
             </div>`
          : `<button class="linkish" data-act="reset-ask">Lernstand zurücksetzen</button>`}
      </div>`;
  }

  function quizView() {
    const q = S.q, w = q.w, mode = S.mode;
    const total = S.queue.length;
    const promptHtml = mode === "article"
      ? `<span class="gap" aria-label="Lücke"></span>${esc(q.prompt)}`
      : esc(q.prompt);
    const showPromptSpeaker = q.promptFr && mode !== "article";
    let body = "";

    if (mode === "choice" || mode === "article") {
      body = `<div class="opts ${mode === "article" ? "three" : ""}">
        ${q.options.map((o, i) => {
          let cls = "";
          if (S.answered) {
            if (o === q.correct) cls = "is-right";
            else if (o === S.picked) cls = "is-wrong";
            else cls = "is-dim";
          }
          return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${S.answered ? "disabled" : ""}>
            ${mode === "choice" ? `<span class="k" aria-hidden="true">${i + 1}</span>` : ""}<span>${esc(o)}</span></button>`;
        }).join("")}
      </div>`;
    } else if (mode === "write") {
      body = `<form class="write" id="wform" autocomplete="off">
        <div class="write-row">
          <input id="answer" type="text" lang="fr" autocapitalize="off" autocorrect="off" spellcheck="false"
            aria-label="Deine Antwort auf Französisch" placeholder="z. B. le parc" value="${esc(S.typed)}" ${S.answered ? "disabled" : ""}>
        </div>
        ${S.answered ? "" : `
        <div class="keys" aria-label="Sonderzeichen">
          ${["é", "è", "ê", "à", "â", "ô", "î", "û", "ù", "ç", "'"].map(c => `<button type="button" data-act="key" data-c="${c}" aria-label="${c} einfügen">${c}</button>`).join("")}
        </div>
        <button class="btn wide" type="submit">Prüfen</button>`}
      </form>`;
    } else if (mode === "cards") {
      if (!S.flipped) {
        body = `<button class="btn wide" data-act="flip">Umdrehen</button>`;
      } else {
        body = `<div class="panel card-back">
            <div class="${q.toDe ? "de" : "fr"}" style="${q.toDe ? "" : "font-family:var(--display);font-size:30px;font-weight:800;line-height:1.15"}">${esc(q.toDe ? w.de : w.fr)}</div>
            <div class="ipa">${q.toDe ? esc(w.fr) + " " : ""}${esc(w.ipa)}</div>
            ${!q.toDe ? `<div style="margin-top:8px;display:flex;justify-content:center">${speakBtn(w.fr, "mini-speak")}</div>` : ""}
            ${w.note ? `<p class="small">${esc(w.note)}</p>` : ""}
          </div>
          <div class="btn-row">
            <button class="btn bad" data-act="card-no">Noch nicht</button>
            <button class="btn good" data-act="card-yes">Gewusst</button>
          </div>`;
      }
    }

    let fb = "";
    if (S.answered && S.res) {
      const r = S.res;
      const solution = mode === "article"
        ? `<b>${esc(w.fr)}</b> = ${esc(w.de)}`
        : `<b>${esc(w.fr)}</b> <span class="ipa">${esc(w.ipa)}</span> = ${esc(w.de)}`;
      const lead = r.lead ? `<p>${esc(r.lead)}</p>` : "";
      const yours = mode === "write" && r.kind !== "right" ? `<p>Du hast geschrieben: <b>${esc(S.typed)}</b></p>` : "";
      fb = `<div class="fb ${r.kind}" role="status">
        <h3>${esc(r.title)}</h3>
        ${lead}${yours}
        <div class="sol-line"><p class="sol">${r.kind === "right" ? "" : "Richtig ist: "}${solution}</p>${speakBtn(w.fr, "mini-speak")}</div>
        ${w.note ? `<p class="note">${esc(w.note)}</p>` : ""}
      </div>
      <button class="btn wide" data-act="next" id="nextBtn">${S.i + 1 >= total ? "Ergebnis ansehen" : "Weiter"}</button>`;
    }

    return `
      <div class="qtop">
        <button class="ghost" data-act="home">← Übersicht</button>
        <span class="count">${S.i + 1} / ${total}</span>
        <span class="score" aria-label="${S.right} richtig">✓ ${S.right}</span>
      </div>
      <div class="meter thin" aria-hidden="true"><span style="width:${(S.i / total) * 100}%"></span></div>
      <p class="ask">${esc(q.ask)}</p>
      <div class="plaque">
        <div class="plaque-inner">
          <div class="arr">${MODES[mode].name}</div>
          <div class="word" lang="${q.promptFr ? "fr" : "de"}" style="${canSpeak && showPromptSpeaker ? "padding:0 36px" : ""}">${promptHtml}</div>
          ${showPromptSpeaker ? speakBtn(q.prompt) : ""}
        </div>
      </div>
      ${body}
      ${fb}`;
  }

  function resultView() {
    const total = S.queue.length;
    const pct = S.right / total;
    const stars = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .4 ? 1 : 0;
    const msg = pct === 1 ? "Parfait ! Alles richtig."
      : stars === 3 ? "Très bien ! Fast alles richtig."
      : stars === 2 ? "Bien ! Übe die Fehler noch einmal."
      : "Courage ! Mit jeder Runde wird es leichter.";
    const STAR = '<path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/>';
    const missed = S.wrong.map(id => byId[id]);
    return `
      <div class="plaque hero">
        <div class="plaque-inner">
          <div class="arr">${MODES[S.mode].name} · Ergebnis</div>
          <div class="word" style="font-variant-numeric:tabular-nums">${S.right} / ${total}</div>
        </div>
      </div>
      <div class="stars" aria-label="${stars} von 3 Sternen">
        ${[0, 1, 2].map(i => `<svg viewBox="0 0 24 24" class="${i < stars ? "on" : "off"}" aria-hidden="true">${STAR}</svg>`).join("")}
      </div>
      <p class="result-msg">${msg}</p>
      ${missed.length ? `
        <section class="panel">
          <h2 class="label">Diese Wörter übst du noch</h2>
          <ul class="miss">
            ${missed.map(w => `<li><b>${esc(w.fr)}</b><span class="de">${esc(w.de)}</span></li>`).join("")}
          </ul>
        </section>` : ""}
      <div class="stack">
        ${missed.length ? `<button class="btn wide" data-act="retry-wrong">Nur die Fehler üben (${missed.length})</button>` : ""}
        <button class="btn wide ${missed.length ? "secondary" : ""}" data-act="again">Neue Runde</button>
        <button class="btn wide secondary" data-act="home">Zur Übersicht</button>
      </div>`;
  }

  const FLEA = `<svg class="flea" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="30" style="fill:var(--card)"/>
    <text x="32" y="44" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="34" style="fill:var(--plaque)">où</text>
    <ellipse cx="25" cy="10" rx="5" ry="4" style="fill:var(--accent)"/>
    <circle cx="23" cy="9" r="1.2" style="fill:var(--card)"/>
    <path d="M28 12 l5 5 M22 13 l-3 5 M26 13 l1 5" style="stroke:var(--accent)" stroke-width="1.6" stroke-linecap="round"/>
  </svg>`;

  function afterRender() {
    if (S.screen === "quiz") {
      if (S.answered) { const n = document.getElementById("nextBtn"); if (n) n.focus({ preventScroll: true }); }
      else if (S.mode === "write") { const inp = document.getElementById("answer"); if (inp && matchMedia("(pointer: fine)").matches) inp.focus(); }
      const f = document.getElementById("wform");
      if (f) f.addEventListener("submit", e => { e.preventDefault(); if (!S.answered) answerWrite(document.getElementById("answer").value); });
    }
    if (S.screen === "result") {
      const pct = S.right / S.queue.length;
      if (pct >= .9) confetti();
      window.scrollTo({ top: 0 });
    }
  }

  // ---------- Bedienung ----------
  app.addEventListener("pointerdown", e => {
    // Sonderzeichen-Tasten sollen den Fokus im Eingabefeld lassen (Handy-Tastatur bleibt offen)
    if (e.target.closest('[data-act="key"]')) e.preventDefault();
  });

  app.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act;
    switch (act) {
      case "speak": speak(b.dataset.text); break;
      case "dir": dir = b.dataset.v; save(KEY + ".dir", dir); render(); break;
      case "start": startRound(b.dataset.mode); break;
      case "home": S = { screen: "home" }; render(); window.scrollTo({ top: 0 }); break;
      case "pick": answerChoice(+b.dataset.i); break;
      case "next": next(); break;
      case "flip": S.flipped = true; render(); if (S.q.toDe === false) speak(S.q.w.fr); break;
      case "card-yes": answerCard(true); break;
      case "card-no": answerCard(false); break;
      case "key": {
        const inp = document.getElementById("answer");
        if (!inp) break;
        const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
        inp.value = inp.value.slice(0, s) + b.dataset.c + inp.value.slice(en);
        inp.focus(); inp.setSelectionRange(s + 1, s + 1);
        break;
      }
      case "retry-wrong": startRound(S.mode, S.wrong.map(id => byId[id])); break;
      case "again": startRound(S.mode); break;
      case "reset-ask": S.confirmReset = true; render(); break;
      case "reset-no": S.confirmReset = false; render(); break;
      case "reset-yes": progress = {}; save(KEY, progress); S.confirmReset = false; render(); break;
    }
  });

  document.addEventListener("keydown", e => {
    if (S.screen !== "quiz" || e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = e.target.tagName;
    if (e.key === "Enter" && S.answered && tag !== "BUTTON" && tag !== "INPUT") { e.preventDefault(); next(); return; }
    if (tag === "INPUT") return;
    if (!S.answered && (S.mode === "choice" || S.mode === "article") && /^[1-4]$/.test(e.key)) {
      const i = +e.key - 1; if (i < S.q.options.length) answerChoice(i);
    }
    if (S.mode === "cards" && !S.flipped && (e.key === " " || e.key === "Enter") && tag !== "BUTTON") { e.preventDefault(); S.flipped = true; render(); }
  });

  // ---------- Konfetti bei 3 Sternen ----------
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
    const ctx = c.getContext("2d"); const dpr = window.devicePixelRatio || 1;
    const W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
    const cs = getComputedStyle(document.documentElement);
    const cols = ["--accent", "--plaque", "--plaque-frame", "--ok", "--margin"].map(v => cs.getPropertyValue(v).trim());
    const P = Array.from({ length: 140 }, () => ({
      x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35,
      vx: (Math.random() - .5) * 14 * dpr, vy: (-Math.random() * 14 - 4) * dpr,
      s: (4 + Math.random() * 5) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
      c: cols[Math.floor(Math.random() * cols.length)],
    }));
    const t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, W, H);
      P.forEach(p => {
        p.vy += .45 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      });
      if (t - t0 < 2200) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }

  render();
})();
</script>
</body>
</html>
